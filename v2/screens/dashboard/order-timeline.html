<!DOCTYPE html>
<!--
  DISCOVERY SCREEN — "Order Timeline"
  ---------------------------------------------------------------------
  Destination of the clock button in Recent Orders. The app routes to
    /platform/order-timeline/<invoice>/<status>          (src/pages/OrderTimeline.jsx)
  A file:// prototype cannot use path segments, so the same two values
  travel as a query string:
    order-timeline.html?order=<invoice>&status=<status>

  SCOPE: this screen exists so the flow is walkable and the transition is
  real. Its body is built from seed data and the SSOT-1 status graph — it
  has NOT been parity-checked against OrderTimeline.jsx yet (addendum-003 S9).
  The chrome around it IS the app's, via shell.js.
-->
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Timeline — Murli (discovery)</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['system-ui', 'sans-serif', 'Arial', 'Helvetica'] } } } };
</script>
<style>
  html, body { font-family: system-ui, sans-serif, Arial, Helvetica; }
  [hidden] { display: none !important; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="antialiased">
<div id="app"></div>

<script src="seed.inline.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SEED, I = window.ICON;

  function qs(k) {
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function money(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(iso) { var p = String(iso).split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }

  var id = qs('order');
  var order = S.orders.filter(function (o) { return o.id === id; })[0];

  var content = window.SHELL.render({
    title: 'Order Timeline',
    icon: 'ShoppingCart',
    active: 'Order',
    back: 'dashboard.html'
  });

  if (!order) {
    content.innerHTML = '<div class="rounded-xl border border-slate-200 bg-white p-8 text-center">' +
      '<p class="text-sm text-slate-600">No order <b>' + esc(id || '(none)') + '</b> in the seed.</p>' +
      '<a href="dashboard.html" class="inline-block mt-3 text-sm text-emerald-600 underline">Back to dashboard</a></div>';
    return;
  }

  /* The timeline is DERIVED from the order's status + fulfilment counts, i.e.
     from the SSOT-1 transition graph rather than stored events — the seed has
     no event log. Each step therefore shows what the graph implies, not a
     recorded timestamp, except for "Order placed". */
  var steps = [{ label: 'Order placed', when: fmtDate(order.date) + ', ' + order.time, done: true, icon: 'FiShoppingBag' }];
  var dispatches = 0, deliveries = 0;
  order.fulfilment.forEach(function (f) {
    if (f.kind === 'dispatch') dispatches += f.count; else deliveries += f.count;
  });
  if (order.status === 'Cancelled') {
    steps.push({ label: 'Order cancelled', when: 'terminal state', done: true, bad: true, icon: 'FiX' });
  } else {
    steps.push({ label: dispatches ? dispatches + ' dispatch' + (dispatches > 1 ? 'es' : '') + ' created' : 'Awaiting dispatch',
      when: dispatches ? 'recorded' : 'not yet', done: !!dispatches, icon: 'FiTruck' });
    steps.push({ label: deliveries ? deliveries + ' delivery run' + (deliveries > 1 ? 's' : '') : 'Awaiting delivery',
      when: deliveries ? 'recorded' : 'not yet', done: !!deliveries, icon: 'FiMapPin' });
    steps.push({ label: 'Delivered', when: order.status === 'Delivered' ? 'complete' : 'not yet',
      done: order.status === 'Delivered', icon: 'FiCheck' });
  }

  var badge = order.status === 'Cancelled' ? 'bg-red-50 text-red-700'
    : order.status === 'Delivered' ? 'bg-emerald-50 text-emerald-700'
    : order.status === 'Dispatched' ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700';

  content.innerHTML =
    '<div class="rounded-xl border border-slate-200 bg-white shadow-sm p-4 sm:p-6 mb-4">' +
      '<div class="flex flex-wrap items-start justify-between gap-3">' +
        '<div><p class="text-xs text-slate-500 mb-1">Order Number</p>' +
          '<p class="text-lg font-mono font-semibold text-slate-900">' + esc(order.id) + '</p>' +
          '<p class="text-sm text-slate-600 mt-1">' + esc(order.customer.name || order.customer.phone) +
            ' · ' + esc(order.customer.phone) + '</p></div>' +
        '<div class="text-right"><span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ' + badge + '">' +
          esc(order.status === 'Inprogress' ? 'InProgress' : order.status) + '</span>' +
          '<p class="text-lg font-semibold text-slate-900 mt-2">' + money(order.amount) + '</p></div>' +
      '</div></div>' +

    '<div class="rounded-xl border border-slate-200 bg-white shadow-sm p-4 sm:p-6 mb-4">' +
      '<h2 class="text-base font-semibold text-slate-800 mb-1">Fulfilment timeline</h2>' +
      '<p class="text-xs text-slate-500 mb-5">Derived from the order status and its dispatch/delivery counts — the ' +
        'seed carries no event log, so only "Order placed" has a real timestamp.</p>' +
      '<ol class="relative border-l border-slate-200 ml-3">' +
        steps.map(function (s) {
          var dot = s.bad ? 'bg-red-500' : s.done ? 'bg-emerald-500' : 'bg-slate-300';
          var txt = s.done ? 'text-slate-800' : 'text-slate-400';
          return '<li class="mb-6 ml-6 last:mb-0">' +
            '<span class="absolute -left-3 flex items-center justify-center w-6 h-6 rounded-full ' + dot + ' text-white ring-4 ring-white">' +
              I.feather(s.icon, 'w-3 h-3') + '</span>' +
            '<p class="text-sm font-semibold ' + txt + '">' + esc(s.label) + '</p>' +
            '<p class="text-xs text-slate-500">' + esc(s.when) + '</p></li>';
        }).join('') +
      '</ol></div>' +

    '<div class="rounded-xl border border-slate-200 bg-white shadow-sm p-4 sm:p-6">' +
      '<h2 class="text-base font-semibold text-slate-800 mb-3">Items</h2>' +
      '<div class="space-y-2">' + order.items.map(function (it) {
        return '<div class="border border-slate-200 rounded p-2">' +
          '<div class="flex items-center justify-between gap-3">' +
            '<p class="text-sm font-medium text-slate-800">' + esc(it.name) + '</p>' +
            '<p class="text-sm font-semibold text-slate-900">' + money(it.amount) + '</p></div>' +
          '<p class="text-xs text-slate-500 mt-0.5">' + it.qty + ' ' + esc(it.unit) + ' × ' + money(it.rate) + '</p></div>';
      }).join('') + '</div>' +
      '<div class="flex items-center justify-between border-t border-slate-200 mt-3 pt-3">' +
        '<span class="text-sm font-semibold text-slate-700">Order total</span>' +
        '<span class="text-sm font-bold text-slate-900">' + money(order.amount) + '</span></div>' +
      '<div class="mt-5 flex flex-wrap gap-2">' +
        '<a href="order.html?order=' + encodeURIComponent(order.id) + '&status=' + encodeURIComponent(order.status) + '" ' +
          'class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-700 hover:bg-slate-50">' +
          I.feather('FiEye', 'w-4 h-4') + 'View order</a>' +
        '<a href="dashboard.html" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-700 hover:bg-slate-50">' +
          I.feather('FiChevronLeft', 'w-4 h-4') + 'Back to dashboard</a>' +
      '</div></div>';
})();
</script>
</body>
</html>
